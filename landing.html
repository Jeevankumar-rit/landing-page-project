<!DOCTYPE html>
<html>
<head>
<title>Sprout - Landing Page</title>
<style>
  body {
    font-family: Arial;
    text-align: center;
    margin: 0;
  }
  .hero {
    background: darkgreen;
    color: white;
    padding: 50px;
  }
  .btn {
    background: orange;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-radius: 5px;
  }
  .features {
    display: flex;
    justify-content: center;
  }
  .box {
    background: #eee;
    margin: 10px;
    padding: 20px;
    width: 200px;
    border-radius: 8px;
  }
  footer {
    background: darkgreen;
    color: white;
    padding: 15px;
  }
</style>
</head>
<body>

  <!-- Hero Section -->
  <div class="hero">
    <h1>A Plant Box for Beginners</h1>
    <p>Get an easy-care plant delivered every month.</p>
    <a href="#" class="btn">Get Started</a>
  </div>

  <!-- Features Section -->
  <div class="features">
    <div class="box">
      <h3>Easy Care</h3>
      <p>Plants matched to your home.</p>
    </div>
    <div class="box">
      <h3>Monthly Delivery</h3>
      <p>New plant every month.</p>
    </div>
    <div class="box">
      <h3>Expert Help</h3>
      <p>Support whenever needed.</p>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Sprout</p>
  </footer>

</body>
</html>
